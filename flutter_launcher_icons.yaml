# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/Icon_Main_Dark.png"

  android: "launcher_icon"
  image_path_android: "assets/icon/Icon_Main_Dark.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/icon/Icon_Background_Dark.png"
  adaptive_icon_foreground: "assets/icon/Icon_Foreground_Dark.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/icon/Icon_Monochrome_Foreground.png"

  ios: true
  image_path_ios: "assets/icon/Icon_Main_Dark.png"
  remove_alpha_ios: true
  image_path_ios_Dark_transparent: "assets/icon/Icon_Foreground_Dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/Icon_Foreground_Dark.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#072142"

  web:
    generate: true
    image_path: "assets/icon/favicon.ico"
    background_color: "#072142"
    theme_color: "#072142"

  windows:
    generate: true
    image_path: "assets/icon/Icon_Main_Dark.png"
    icon_size: 256 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/icon/Icon_Main_Dark.png"

# Light-mode asset filenames available in `assets/icon/`:
# - Icon_Main_Light.png
# - Icon_Background_Light.png
# - Icon_Foreground_Light.png
