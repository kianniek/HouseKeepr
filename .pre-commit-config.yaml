repos:
  - repo: local
    hooks:
      - id: flutter-format
        name: Flutter Format
        entry: dart format --output=none --set-exit-if-changed .
        language: system
        files: \.dart$
        pass_filenames: false

      - id: flutter-analyze
        name: Flutter Analyze
        entry: flutter analyze
        language: system
        pass_filenames: false

      - id: flutter-test
        name: Flutter Test
        entry: flutter test
        language: system
        pass_filenames: false