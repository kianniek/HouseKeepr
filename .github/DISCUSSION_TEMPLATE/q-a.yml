title: "Q&A"
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Use this for questions and troubleshooting. Please avoid posting secrets.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you tried? Any errors?
    validations:
      required: false

  - type: input
    id: flutter_version
    attributes:
      label: Flutter version (optional)
      placeholder: "flutter --version"
    validations:
      required: false
