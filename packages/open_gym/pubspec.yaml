name: open_gym
description: "OpenGym on-demand workout tracker module for HealthKeepr."
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=1.17.0"

dependencies:
  audioplayers: ^6.1.0
  flutter:
    sdk: flutter
  health_keepr:
    path: ../health_keepr
  http: ^1.5.0
  image_picker: ^1.2.0
  path_drawing: ^1.0.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/exercises.json
    - assets/body_paths.json
